[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kernelsense"
version = "0.1.0"
description = "Intelligent Operating System Analytics and Resource Management Platform"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Kislay Ratnakar Upadhyay" }]
dependencies = [
    "psutil>=5.9",
    "pandas>=2.0",
    "numpy>=1.24",
    "scikit-learn>=1.3",
    "statsmodels>=0.14",
    "networkx>=3.0",
    "plotly>=5.18",
    "streamlit>=1.30",
]

[project.optional-dependencies]
dev = ["pytest>=7.4"]

[project.scripts]
kernelsense = "kernelsense.cli:main"

[tool.setuptools.packages.find]
include = ["kernelsense*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
